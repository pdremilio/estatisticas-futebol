name: Baixar prévia (API-Football)

# Baixa o Brasileirão 2024 com escanteios, cartões, xG e lances, aos poucos: o plano grátis só dá
# um jogo por requisição e 100 por dia, então cada execução pega até 85 jogos. Roda sozinho uma vez
# por dia até completar a temporada (~5 dias); depois não gasta mais nada.
# Guarda dados-2024.js no repositório e republica o site. Não altera nada do site principal.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: estatisticas-futebol
    steps:
      - name: Pegar os arquivos
        uses: actions/checkout@v4

      - name: Baixar o Brasileirão 2024 da API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 baixar_previa_2024.py 71 2024

      - name: Guardar dados-2024.js no repositório
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-2024.js
          if git diff --cached --quiet; then
            echo "Sem jogos novos."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Prévia: mais jogos do Brasileirão 2024 (API-Football)"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Republicar o site com a prévia
        if: steps.guardar.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atualizar.yml --ref main
