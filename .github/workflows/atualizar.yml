name: Atualizar dados e publicar

# O agendamento do GitHub atrasa horas no plano grátis. Por isso cada execução, ao terminar,
# chama a próxima (job "proxima"): a cada ~60 min quando há jogo rolando (o placar ao vivo vem da ESPN,
# no navegador; aqui é só para tabela, estatísticas e projeções) e, sem jogos, só perto do próximo jogo. O cron (a cada 6 h) fica de reserva caso a corrente pare.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: estatisticas-futebol
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Pegar os arquivos do site
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Baixar os dados já publicados
        run: |
          curl -sfL "${{ steps.pages.outputs.base_url }}/dados.js" -o dados.js || rm -f dados.js
          curl -sfL "${{ steps.pages.outputs.base_url }}/dados5.js" -o dados5.js || rm -f dados5.js
          curl -sfL "${{ steps.pages.outputs.base_url }}/cache5.json" -o cache5.json || rm -f cache5.json

      - name: Atualizar dados
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 atualizar_dados.py

      # Beta 5 (página de teste): ESPN + FotMob. Se falhar, não atrapalha o site principal,
      # e a página de teste usa os dados da football-data com um aviso.
      - name: Atualizar dados da beta 5 (ESPN + FotMob)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 atualizar_b5.py

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp index.html estilo.css app.js motor.js dados-demo.js config.js contas.js aovivo.js _site/
          if [ -f dados.js ]; then cp dados.js _site/; fi
          if [ -f agenda.json ]; then cp agenda.json _site/; fi
          for f in teste.html app-teste.js aovivo-teste.js estilo-teste.css motor-teste.js dados5.js cache5.json; do if [ -f "$f" ]; then cp "$f" _site/; fi; done

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: estatisticas-futebol/_site

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4

  proxima:
    needs: atualizar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Só uma espera por vez: quando começa uma execução nova, a espera da anterior é cancelada
    # (antes elas se acumulavam e travavam a fila do GitHub).
    concurrency:
      group: espera-proxima
      cancel-in-progress: true
    steps:
      - name: Calcular quando será a próxima atualização (pausa quando não há jogos)
        id: quando
        run: |
          cat > quando.py <<'PY'
          import json, sys, urllib.request
          from datetime import datetime, timezone, timedelta
          agora = datetime.now(timezone.utc)
          if len(sys.argv) > 2:
              agora = datetime.fromisoformat(sys.argv[2])
          BRT = timezone(timedelta(hours=-3))
          NORMAL, MAXIMO = 60 * 60, int(5.5 * 3600)
          # lê os dados da football-data e os da beta 5 (que tem mais ligas)
          comps = []
          for url in sys.argv[1].split(","):
              try:
                  txt = urllib.request.urlopen(url, timeout=30).read().decode("utf-8")
                  comps += list(json.loads(txt[txt.index("{"):txt.rindex("}") + 1]).get("competicoes", {}).values())
              except Exception as e:
                  print(f"Não consegui ler {url} ({e}).", file=sys.stderr)
          if not comps:
              print("Sem dados; sigo o ritmo normal.", file=sys.stderr)
              print(NORMAL); sys.exit()
          ativos, proximo = 0, None
          for comp in comps:
              for p in comp.get("partidas", []):
                  s, d = p.get("s"), p.get("d")
                  if not d or s in ("FINISHED", "CANCELLED", "POSTPONED", "AWARDED", "SUSPENDED"):
                      continue
                  inicio = datetime.fromisoformat(d.replace("Z", "+00:00"))
                  if s in ("IN_PLAY", "PAUSED", "LIVE") or inicio - timedelta(minutes=15) <= agora <= inicio + timedelta(hours=3):
                      ativos += 1
                  elif inicio > agora and (proximo is None or inicio < proximo):
                      proximo = inicio
          if ativos:
              espera = NORMAL
              print(f"{ativos} jogo(s) rolando ou começando agora: próxima atualização em 60 min.", file=sys.stderr)
          elif proximo:
              espera = max(NORMAL, min(MAXIMO, int((proximo - agora - timedelta(minutes=10)).total_seconds())))
              print(f"Sem jogos agora. Próximo jogo às {proximo.astimezone(BRT):%d/%m %H:%M} (Brasília); espero {espera // 60} min.", file=sys.stderr)
          else:
              espera = MAXIMO
              print("Nenhum jogo agendado encontrado; espero o máximo (5h30).", file=sys.stderr)
          print(espera)
          PY
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          segundos=$(python3 quando.py "$base/dados.js,$base/dados5.js")
          echo "segundos=$segundos" >> "$GITHUB_OUTPUT"

      - name: Esperar
        # "& wait" deixa a espera ser interrompida quando o GitHub cancela o job
        run: |
          sleep ${{ steps.quando.outputs.segundos }} &
          wait $!

      - name: Chamar a próxima atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mais_novas=$(gh run list --repo "${{ github.repository }}" --workflow atualizar.yml --limit 20 \
            --json databaseId,status -q "[.[] | select(.status != \"completed\" and .databaseId > ${{ github.run_id }})] | length")
          if [ "$mais_novas" = "0" ]; then
            gh workflow run atualizar.yml --repo "${{ github.repository }}" --ref main
            echo "Próxima atualização chamada."
          else
            echo "Já existe uma atualização mais nova em andamento; não chamo outra."
          fi
