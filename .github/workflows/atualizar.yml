name: Atualizar dados e publicar

# O agendamento do GitHub atrasa horas no plano grátis. Por isso cada execução, ao terminar,
# chama a próxima (job "proxima"): a cada ~60 min quando há jogo rolando (o ao vivo vem do servidor da Cloudflare
# e da ESPN, no navegador; aqui é só para tabela, estatísticas, projeções e odds) e, sem jogos, só perto do próximo jogo. O cron (a cada 6 h) fica de reserva caso a corrente pare.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: estatisticas-futebol
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Pegar os arquivos do site
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Baixar os dados já publicados
        run: |
          curl -sfL "${{ steps.pages.outputs.base_url }}/dados5.js" -o dados5.js || rm -f dados5.js
          curl -sfL "${{ steps.pages.outputs.base_url }}/cache5.json" -o cache5.json || rm -f cache5.json
          curl -sfL "${{ steps.pages.outputs.base_url }}/cache5d.json" -o cache5d.json || rm -f cache5d.json
          curl -sfL "${{ steps.pages.outputs.base_url }}/extra5d.js" -o extra5d.js || rm -f extra5d.js
          curl -sfL "${{ steps.pages.outputs.base_url }}/odds_casas.json" -o odds_casas.json || rm -f odds_casas.json

      # Odds da média das casas (The Odds API), a 2ª fonte de odds (a 1ª é a bet365 da 5Dollar). Rápido: no
      # máximo 1 pedido por liga a cada 12 h. Se falhar, ficam as odds guardadas da vez anterior.
      - name: Odds da média das casas
        continue-on-error: true
        timeout-minutes: 5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 atualizar_odds.py

      # Base do site: ESPN + FotMob (dados5.js). Se falhar, o site segue com a versão publicada da vez anterior.
      - name: Atualizar dados (ESPN + FotMob)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 atualizar_b5.py

      # Escudos dos times e ligas no próprio site (bloqueadores de anúncios escondem os da ESPN). A pasta fica
      # guardada entre as execuções: cada vez só baixa os escudos novos.
      - name: Guardar os escudos entre as execuções
        uses: actions/cache@v4
        with:
          path: estatisticas-futebol/escudos
          key: escudos-v1-${{ github.run_id }}
          restore-keys: escudos-v1-

      - name: Escudos no próprio site
        continue-on-error: true
        timeout-minutes: 5
        run: python3 baixar_escudos.py

      # Números extras de pré-jogo (ataques, ataques perigosos, 1º tempo) pela 5DollarFootballAPI.
      # A chave fica no segredo FIVE_DOLLAR_KEY; sem ela, o passo não faz nada. Se falhar, o site segue normal.
      - name: Números extras (5DollarFootballAPI)
        continue-on-error: true
        timeout-minutes: 10
        env:
          FIVE_DOLLAR_KEY: ${{ secrets.FIVE_DOLLAR_KEY }}
        run: python3 atualizar_5d.py

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp index.html estilo.css app.js motor.js config.js contas.js aovivo.js _site/
          if [ -d escudos ]; then cp -r escudos _site/; fi
          for f in teste.html app-teste.js aovivo-teste.js estilo-teste.css motor-teste.js dados5.js cache5.json extra5d.js cache5d.json odds_casas.json titulares5.json manifest.webmanifest sw.js icone-192.png icone-512.png icone-mascara-512.png icone-apple-180.png; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          # versões para o navegador guardar os arquivos: código (muda só quando o código muda) e dados (cada execução)
          VC=$(cat _site/app.js _site/motor.js _site/aovivo.js _site/estilo.css _site/contas.js _site/config.js | sha1sum | cut -c1-10)
          sed -i "s/__VC__/$VC/; s/__VD__/${GITHUB_RUN_ID}/" _site/index.html
          if [ -f _site/teste.html ]; then
            VCT=$(cat _site/app-teste.js _site/motor-teste.js _site/aovivo-teste.js _site/estilo-teste.css _site/contas.js _site/config.js 2>/dev/null | sha1sum | cut -c1-10)
            sed -i "s/__VC__/$VCT/; s/__VD__/${GITHUB_RUN_ID}/" _site/teste.html
          fi
          # o site aberto (ou o app instalado) confere este arquivo e se atualiza sozinho quando a versão muda
          printf '{"c":"%s","t":"%s","d":"%s"}\n' "$VC" "${VCT:-}" "$GITHUB_RUN_ID" > _site/versao.json

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: estatisticas-futebol/_site

      # a publicação às vezes falha do lado do GitHub ("artifact não encontrado"): espera um pouco e tenta de novo
      - name: Publicar
        id: publicar
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar antes da 2ª tentativa
        if: steps.publicar.outcome == 'failure'
        run: sleep 45

      - name: Publicar (2ª tentativa)
        if: steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4

  proxima:
    needs: atualizar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Só uma espera por vez: quando começa uma execução nova, a espera da anterior é cancelada
    # (antes elas se acumulavam e travavam a fila do GitHub).
    concurrency:
      group: espera-proxima
      cancel-in-progress: true
    steps:
      - name: Calcular quando será a próxima atualização (pausa quando não há jogos)
        id: quando
        run: |
          cat > quando.py <<'PY'
          import json, sys, urllib.request
          from datetime import datetime, timezone, timedelta
          agora = datetime.now(timezone.utc)
          if len(sys.argv) > 2:
              agora = datetime.fromisoformat(sys.argv[2])
          BRT = timezone(timedelta(hours=-3))
          NORMAL, MAXIMO = 60 * 60, int(5.5 * 3600)
          # lê os dados publicados do site (dados5.js)
          comps = []
          for url in sys.argv[1].split(","):
              try:
                  txt = urllib.request.urlopen(url, timeout=30).read().decode("utf-8")
                  comps += list(json.loads(txt[txt.index("{"):txt.rindex("}") + 1]).get("competicoes", {}).values())
              except Exception as e:
                  print(f"Não consegui ler {url} ({e}).", file=sys.stderr)
          if not comps:
              print("Sem dados; sigo o ritmo normal.", file=sys.stderr)
              print(NORMAL); sys.exit()
          ativos, proximo = 0, None
          for comp in comps:
              for p in comp.get("partidas", []):
                  s, d = p.get("s"), p.get("d")
                  if not d or s in ("FINISHED", "CANCELLED", "POSTPONED", "AWARDED", "SUSPENDED"):
                      continue
                  inicio = datetime.fromisoformat(d.replace("Z", "+00:00"))
                  if s in ("IN_PLAY", "PAUSED", "LIVE") or inicio - timedelta(minutes=15) <= agora <= inicio + timedelta(hours=3):
                      ativos += 1
                  elif inicio > agora and (proximo is None or inicio < proximo):
                      proximo = inicio
          if ativos:
              espera = NORMAL
              print(f"{ativos} jogo(s) rolando ou começando agora: próxima atualização em 60 min.", file=sys.stderr)
          elif proximo:
              espera = max(NORMAL, min(MAXIMO, int((proximo - agora - timedelta(minutes=10)).total_seconds())))
              print(f"Sem jogos agora. Próximo jogo às {proximo.astimezone(BRT):%d/%m %H:%M} (Brasília); espero {espera // 60} min.", file=sys.stderr)
          else:
              espera = MAXIMO
              print("Nenhum jogo agendado encontrado; espero o máximo (5h30).", file=sys.stderr)
          print(espera)
          PY
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          segundos=$(python3 quando.py "$base/dados5.js")
          echo "segundos=$segundos" >> "$GITHUB_OUTPUT"

      - name: Esperar
        # "& wait" deixa a espera ser interrompida quando o GitHub cancela o job
        run: |
          sleep ${{ steps.quando.outputs.segundos }} &
          wait $!

      - name: Chamar a próxima atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mais_novas=$(gh run list --repo "${{ github.repository }}" --workflow atualizar.yml --limit 20 \
            --json databaseId,status -q "[.[] | select(.status != \"completed\" and .databaseId > ${{ github.run_id }})] | length")
          if [ "$mais_novas" = "0" ]; then
            gh workflow run atualizar.yml --repo "${{ github.repository }}" --ref main
            echo "Próxima atualização chamada."
          else
            echo "Já existe uma atualização mais nova em andamento; não chamo outra."
          fi
