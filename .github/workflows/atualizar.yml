name: Atualizar dados e publicar

# O agendamento do GitHub atrasa horas no plano grátis. Por isso cada execução,
# ao terminar, espera ~25 min e chama a próxima (job "proxima"). O cron fica de reserva.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: estatisticas-futebol
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Pegar os arquivos do site
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Baixar os dados já publicados
        run: curl -sfL "${{ steps.pages.outputs.base_url }}/dados.js" -o dados.js || rm -f dados.js

      - name: Atualizar dados
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 atualizar_dados.py

      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp index.html estilo.css app.js motor.js dados-demo.js _site/
          if [ -f dados.js ]; then cp dados.js _site/; fi

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: estatisticas-futebol/_site

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4

  proxima:
    needs: atualizar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Esperar 25 minutos e chamar a próxima atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1500
          mais_novas=$(gh run list --repo "${{ github.repository }}" --workflow atualizar.yml --limit 20 \
            --json databaseId,status -q "[.[] | select(.status != \"completed\" and .databaseId > ${{ github.run_id }})] | length")
          if [ "$mais_novas" = "0" ]; then
            gh workflow run atualizar.yml --repo "${{ github.repository }}" --ref main
            echo "Próxima atualização chamada."
          else
            echo "Já existe uma atualização mais nova em andamento; não chamo outra."
          fi
