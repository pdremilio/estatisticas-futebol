name = "scanball-aovivo"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "AOVIVO"
class_name = "AoVivo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AoVivo"]

# despertador: a cada minuto guarda o minuto a minuto dos jogos ao vivo, mesmo sem ninguém no site
[triggers]
crons = ["* * * * *"]
